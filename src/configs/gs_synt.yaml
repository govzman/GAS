defaults:
  - model: coco
  - scheduler_model: scheduler_transformer
  - writer: cometml
  - datasets: synt
  - student_solver: sd_student_baseline
  - teacher_solver: sd_teacher_default
  - _self_

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-3

# lr_scheduler:
#   _target_: torch.optim.lr_scheduler.CosineAnnealingLR
#   T_max: ${trainer.n_iters}
#   eta_min: 0.0

loss_config:
  loss_type: "GS"
  loss_key: loss_l1_latents
  disc_weight: 1
  disc_type: latent_4
  disc_lr: 0.00001

trainer:
  n_iters: 5000
  epoch_num: 2500
  # Synthetic pickle may include manual_solver_params.*; print GT MSE this often (0 = off).
  print_gt_solver_every: 25
  accumulation_steps: 4
  # accelerate mixed_precision expects: "no" | "fp16" | "bf16"
  amp: "no"
  ema_decay: 0.999
  device: "cuda"
  seed: 42
