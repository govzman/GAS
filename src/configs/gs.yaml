defaults:
  - model: coco
  - writer: cometml
  - datasets: coco
  - student_solver: sd_student_default
  - teacher_solver: sd_teacher_default
  - _self_

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-3

loss_config:
  loss_type: "GS"
  loss_key: loss_l1_latents
  disc_weight: 1
  disc_type: latent_4
  disc_lr: 0.00001
  
trainer:
  n_iters: 2000
  # Backward compatible: training.py used to read iters_to_accumulate directly.
  # With Accelerate we primarily use accumulation_steps.
  iters_to_accumulate: 2
  accumulation_steps: 2
  # accelerate mixed_precision expects: "no" | "fp16" | "bf16"
  amp: "no"
  ema_decay: 0.999
  device: "cuda"
  seed: 42
