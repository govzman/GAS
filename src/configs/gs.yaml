defaults:
  - model: coco
  - scheduler_model: scheduler_transformer
  - writer: cometml
  - datasets: coco
  - student_solver: sd_student_stepwise_medium
  - teacher_solver: sd_teacher_default
  - _self_

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-3

lr_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${trainer.n_iters}
  eta_min: 0.0

optimizer_a_params:
  _target_: torch.optim.AdamW
  lr: 1e-3

lr_scheduler_a_params:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${trainer.n_iters}
  eta_min: 0.0

loss_config:
  loss_type: "GS"
  loss_key: loss_l1_latents
  disc_weight: 1
  disc_type: latent_4
  disc_lr: 0.00001
  # REPA (DINOv2 alignment); enable with loss_config.use_repa=true
  use_repa: false
  repa_weight: 0.5
  repa_model: dinov2_vitb14
  repa_loss_type: cosine
  repa_grad_through_decoder: true
  use_repa_in_eval: false
  repa_log_per_layer: false
  repa_pretrained: true
  
trainer:
  n_iters: 5000
  epoch_num: 2500
  # Print GT vs predicted GS coefficient MSE (when teacher pickle has manual_solver_params.*); 0 = off.
  print_gt_solver_every: 100
  # Backward compatible: training.py used to read iters_to_accumulate directly.
  # With Accelerate we primarily use accumulation_steps.
  iters_to_accumulate: 2
  accumulation_steps: 2
  # accelerate mixed_precision expects: "no" | "fp16" | "bf16"
  amp: "no"
  ema_decay: 0.999
  device: "cuda"
  seed: 42
