defaults:
  - model: coco
  - scheduler_model: scheduler_transformer
  - writer: cometml
  - datasets: coco
  - student_solver: sd_student_default
  - teacher_solver: sd_teacher_default

loss_config:
  loss_type: "GS"
  loss_key: loss_l1_latents
  disc_weight: 1
  disc_type: latent_4
  disc_lr: 0.00001
  hpsv2:
    enabled: false
    reward_scale: 1.0
    grad_mode: backprop
    reinforce:
      baseline: batch_mean
      ema_beta: 0.99
      entropy_weight: 0.0

solver_param_conditioning:
  enabled: false
  mode: global_per_sample
  input: latent_state
  feature_dim: 256
  hidden_dim: 512
  predict:
    a_diff: true
    c_diff: true
    t_couple: true
    timesteps: false
  init:
    output_zero: true
  clamp:
    enabled: true
    max_abs: 0.1
  stochastic:
    enabled: false
    fixed_std: 0.01
    learn_std: false

# model: src/model/coco
outdir: "data/teachers/sd-v1/nfe=5"
seeds: "00000-01449"
max_batch_size: 4
checkpoint_path: null
create_dataset: true
device: cuda

synthetic_gs_dataset:
  enabled: false
  count: 100
  fixed_noise_seed: 12345
  prompt_seed: 12345
  nfe: 4
  order: 3
  coef_std: 0.01
  t_couple_std: 0.01
  include_t_couple: true
  include_timesteps: true
  t_std: 0.005
  prompts: null