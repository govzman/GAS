defaults:
  - model: coco
  - scheduler_model: scheduler_transformer
  - writer: cometml
  - datasets: coco
  - student_solver: sd_student_default
  - teacher_solver: sd_teacher_default

loss_config:
  loss_type: "GS"
  loss_key: loss_l1_latents
  disc_weight: 1
  disc_type: latent_4
  disc_lr: 0.00001

# model: src/model/coco
outdir: "data/teachers/sd-v1/synt6"
seeds: "00000-00099"
max_batch_size: 1
checkpoint_path: null
create_dataset: true
device: cuda

synthetic_gs_dataset:
  enabled: true
  count: 100
  # Match the 4-step student during the controlled recovery experiment.
  # A 5-to-4 distillation run is a separate later experiment.
  nfe: 4
  order: 3
  # Controlled teacher target. ``prompt_projection`` is a deterministic,
  # prompt-only function of frozen SD text embeddings; ``constant`` is GAS.
  coefficient_mode: prompt_projection
  coefficient_seed: 31415
  base_std: 0.01
  residual_std: 0.01
  projection_gain: 12.0
  # ``unique`` gives one noise per sample; ``fixed`` repeats noise_seed.
  noise_mode: unique
  noise_seed: 10000
  prompt_seed: 2026
  prompts: null
