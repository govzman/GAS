# sd_student_stepwise_lightweight.yaml
steps: 4
order: 3
t_eps: 0.001
latent_channels: 4
text_embed_dim: 768

t_parametrization: diff
t_schedule_parametrization: diff
t_requires_grad: true

t_couple_parametrization: stepwise
t_couple_stepwise_version: lightweight
t_couple_stepwise_hidden_dim: 128
t_couple_stepwise_mlp_layers: 2
t_couple_requires_grad: true

a_parametrization: stepwise
a_stepwise_version: lightweight  # ← ключевой параметр!
a_stepwise_hidden_dim: 256
a_stepwise_mlp_layers: 3
a_requires_grad: true

c_parametrization: stepwise
c_stepwise_version: lightweight
c_stepwise_hidden_dim: 256
c_stepwise_mlp_layers: 3
c_requires_grad: true

coef_prediction_mode: step_wise
use_theory_coef: true
guidance_scale: 7.5
