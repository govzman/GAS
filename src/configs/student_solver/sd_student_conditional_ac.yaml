# Controlled conditional-GS experiment: only a/c are trainable. Timesteps and
# model-evaluation offsets stay equal to the common GAS initialization.
steps: 4
order: 3
t_eps: 0.001
latent_channels: 4
text_embed_dim: 768

t_parametrization: diff
t_couple_parametrization: diff
t_requires_grad: false
t_couple_requires_grad: false

a_parametrization: film_mlp
c_parametrization: film_mlp
a_requires_grad: true
c_requires_grad: true
ac_film_hidden_dim: 256

use_theory_coef: true
guidance_scale: 7.5
